<section class="divine-match-section py-10 md:py-12 bg-[#fff5f9]">
  <div class="container mx-auto px-6">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-center gap-12 lg:gap-20">

      <div class="w-full md:w-1/2 flex justify-center md:justify-end">
        <div class="artwork-container relative">
          <img src="https://i.pinimg.com/736x/82/5c/4a/825c4a266d65554ea1c0c99a7a4a5884.jpg" alt="Divine Love"
            class="rounded-[2.5rem] shadow-2xl w-full max-w-[320px] object-cover border-4 border-white">
          <div class="absolute -inset-4 bg-pink-200/20 blur-2xl rounded-full -z-10"></div>
        </div>
      </div>

      <div class="w-full md:w-1/2 text-left space-y-6">
        <div class="space-y-2">
          <p class="font-Roboto text-pink-700 text-xl md:text-2xl leading-snug font-bold">
            "{{ t?.krishnaLoveQuote }}"
          </p>
          <div class="w-12 h-[2px] bg-pink-300 mt-2"></div>
        </div>

        <div class="space-y-1">
          <p class="font-Roboto text-pink-600 font-bold tracking-[0.2em] uppercase text-[10px] mb-2">
            {{ t?.loveStoryHeading }}
          </p>
          <h2 class="font-Roboto text-3xl md:text-4xl text-pink-950 font-bold leading-tight uppercase">
            {{ t?.ctaFinalHeading }}
          </h2>
        </div>

        <div class="quote-box relative pl-6 border-l-4 border-pink-600 py-2">
          <p class="font-Roboto italic text-pink-900/80 text-base md:text-lg leading-relaxed">
            "{{ t?.loveStoryQuote }}"
          </p>
        </div>
      </div>

    </div>
  </div>
</section>
