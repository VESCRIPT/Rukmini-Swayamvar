<section class="promises-section">
    <div class="promises-container">
        <div class="promises-header">
            <h2 class="promises-title"><span class="title-number">7</span> <span class="gold-shine-text">PROMISES</span>
            </h2>
            <p class="promises-subtitle">by our Rukmini Swayamvar Website before you take yours</p>
            <div class="promises-divider" aria-hidden="true">
                <span class="divider-line"></span>
                <span class="divider-icon">✦</span>
                <span class="divider-line"></span>
            </div>
        </div>

        <div class="content-wrapper">
            <!-- Left: Image with Premium Frame -->
            <div class="image-column">
                <div class="premium-frame">
                    <div class="image-card">
                        <img src="assets/images/7promises.jpeg" alt="7 Promises" class="couple-img">
                    </div>
                </div>
            </div>

            <!-- Right: Promises List with Premium Items -->
            <div class="list-column">
                <div class="promise-item" *ngFor="let promise of promises; let i = index">
                    <div class="promise-number">{{ i + 1 }}</div>
                    <span class="promise-text">{{ promise }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
