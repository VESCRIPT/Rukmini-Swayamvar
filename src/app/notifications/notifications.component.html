<div class="notifications-container">
  <header class="notifications-header">
    <button class="back-btn" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <h1>Notifications</h1>
    <button
      type="button"
      class="mark-all-header-btn"
      [disabled]="!hasUnread || markingAll"
      (click)="markAllAsRead()">
      Mark all read
    </button>
  </header>

  <div class="notifications-toolbar">
    <div class="filter-tabs" role="tablist" aria-label="Notification filter">
      <button
        type="button"
        class="filter-tab"
        role="tab"
        [class.active]="filter === 'all'"
        (click)="setFilter('all')">
        All
      </button>
      <button
        type="button"
        class="filter-tab"
        role="tab"
        [class.active]="filter === 'unread'"
        (click)="setFilter('unread')">
        Unread
      </button>
    </div>

    <button
      type="button"
      class="select-mode-btn"
      [class.active]="selectionMode"
      (click)="toggleSelectionMode()">
      {{ selectionMode ? 'Cancel' : 'Select' }}
    </button>
  </div>

  <div class="selection-bar" *ngIf="selectionMode">
    <span>{{ selectedCount }} selected</span>
    <button
      type="button"
      class="mark-selected-btn"
      [disabled]="selectedCount === 0 || markingSelected"
      (click)="markSelectedAsRead()">
      Mark selected as read
    </button>
  </div>

  <main class="notifications-content">
    <div class="page-loading" *ngIf="loading">
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading notifications…</span>
    </div>

    <div class="page-empty" *ngIf="!loading && notifications.length === 0">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <h2>{{ filter === 'unread' ? 'No unread notifications' : 'No notifications yet' }}</h2>
      <p>{{ filter === 'unread' ? 'You are all caught up.' : 'When you get updates, they will show up here.' }}</p>
    </div>

    <ul class="notifications-list" *ngIf="!loading && notifications.length > 0">
      <li *ngFor="let item of notifications">
        <button
          type="button"
          class="notification-card"
          [class.unread]="!item.isRead"
          [class.read]="item.isRead"
          [class.selectable]="selectionMode && !item.isRead"
          [class.selected]="isSelected(item.id)"
          (click)="onNotificationClick(item)">
          <span
            *ngIf="selectionMode && !item.isRead"
            class="select-checkbox"
            [class.checked]="isSelected(item.id)"
            (click)="toggleSelect(item, $event)"
            aria-hidden="true"></span>
          <span class="unread-dot" *ngIf="!item.isRead && !selectionMode" aria-hidden="true"></span>
          <span class="card-content">
            <span class="card-title">{{ item.title }}</span>
            <span class="card-message">{{ item.message }}</span>
            <span class="card-time">{{ timeAgo(item.createdAt) }}</span>
          </span>
        </button>
      </li>
    </ul>
  </main>
</div>
