<div class="fp-page">
  <!-- Back button -->
  <button class="fp-back" (click)="onBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
  </button>

  <!-- Card -->
  <div class="fp-card">
    <div class="text-center mb-6">
      <h1 class="font-cinzel gold-shine-text font-bold text-2xl md:text-3xl uppercase tracking-widest leading-tight">
        {{ t.title }}
      </h1>
      <p class="font-cinzel gold-shine-text font-semibold text-xs md:text-sm uppercase tracking-[0.3em] mt-0.5 opacity-80">
        {{ t.subtitle }}
      </p>
    </div>

    <div class="text-center mb-6">
      <h2 class="font-playfair text-[#5a0a24] text-xl font-bold italic mb-2">Forgot Password?</h2>
      <p class="text-[#5a0a24] opacity-70 text-sm">Enter your email and we'll send you an OTP to reset your password.</p>
    </div>

    <form class="fp-form" (submit)="$event.preventDefault(); onSendOtp()">
      <div class="fp-field">
        <label class="fp-label">{{ t.emailLabel }}</label>
        <input type="email" class="fp-input" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>

      <div *ngIf="errorMessage" class="fp-error">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="fp-success">{{ successMessage }}</div>

      <button type="submit" class="fp-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Send OTP</span>
        <span *ngIf="isLoading" class="fp-spinner"></span>
      </button>
    </form>

    <p class="fp-back-row">
      Remembered your password?
      <button type="button" class="fp-back-link" (click)="onBack()">Login</button>
    </p>
  </div>
</div>
