<div class="edit-profile-wrapper">
  <!-- Header -->
  <header class="edit-profile-header">
    <button class="back-btn" (click)="onBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <h1>Edit Profile</h1>
    <div class="header-placeholder"></div>
  </header>

  <!-- Navigation Grid (Row) -->
  <div class="steps-nav-container">
    <div class="steps-grid">
      <div *ngFor="let step of profileSteps" 
           class="step-card" 
           [class.active]="activeStep === step.id"
           (click)="selectStep(step.id)">
        <div class="step-circle">{{ step.id }}</div>
        <div class="step-label">{{ step.label }}</div>
      </div>
    </div>
  </div>

  <div class="partner-prefs-link-card" (click)="openPartnerPreferences()">
    <div class="step-circle">💕</div>
    <div>
      <div class="step-label">Partner Preferences</div>
      <p class="partner-prefs-hint">Set age, religion, location &amp; more for matchmaking</p>
    </div>
    <span class="partner-prefs-arrow" aria-hidden="true">&gt;</span>
  </div>
</div>
