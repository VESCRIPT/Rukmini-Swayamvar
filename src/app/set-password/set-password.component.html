<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-50 via-white to-rose-50 font-inter p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
    <!-- Back Button -->
    <button (click)="onBack()" class="mb-6 text-pink-600 hover:text-pink-800 transition-colors flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="font-cinzel text-3xl font-bold text-pink-900 mb-2">Set your password</h1>
      <p class="text-gray-600 text-sm">Create a secure password for your account</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Password Field -->
      <div class="relative">
        <div
          class="flex items-center gap-3 px-4 py-3 border-2 border-gray-200 rounded-xl focus-within:border-pink-500 transition-colors bg-white">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
            </path>
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
            placeholder="••••••••" class="flex-1 outline-none text-gray-900 placeholder-gray-400 bg-transparent"
            required minlength="6">
          <button type="button" (click)="togglePasswordVisibility()"
            class="text-gray-400 hover:text-gray-600 transition-colors">
            <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
              </path>
            </svg>
            <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
              </path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="relative">
        <div
          class="flex items-center gap-3 px-4 py-3 border-2 border-gray-200 rounded-xl focus-within:border-pink-500 transition-colors bg-white">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
            </path>
          </svg>
          <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword"
            placeholder="••••••••" class="flex-1 outline-none text-gray-900 placeholder-gray-400 bg-transparent"
            required minlength="6">
          <button type="button" (click)="toggleConfirmPasswordVisibility()"
            class="text-gray-400 hover:text-gray-600 transition-colors">
            <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
              </path>
            </svg>
            <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
              </path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="isSubmitting || !password || !confirmPassword"
        class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-4 px-6 rounded-xl hover:from-pink-600 hover:to-rose-600 transition-all duration-300 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!isSubmitting">Continue</span>
        <span *ngIf="isSubmitting" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Setting Password...
        </span>
      </button>

      <p *ngIf="errorMessage" class="text-center text-sm text-red-600 font-medium">
        {{ errorMessage }}
      </p>
    </form>
  </div>

  <div *ngIf="showSuccessPopup" class="sp-success-overlay" (click)="closeSuccessPopup()">
    <div class="sp-success-card" (click)="$event.stopPropagation()">
      <div class="sp-success-icon" aria-hidden="true">✓</div>
      <h3 class="sp-success-title">Success</h3>
      <p class="sp-success-text">{{ successMessage }}</p>
      <button type="button" class="sp-success-btn" (click)="closeSuccessPopup()">OK</button>
    </div>
  </div>
</div>
