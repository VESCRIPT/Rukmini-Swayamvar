<div class="ta-page" *ngIf="isLoading">
  <header class="ta-header">
    <button type="button" class="ta-back" (click)="goBack()" aria-label="Go back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <div class="ta-header-text"><h1>Article</h1></div>
    <div class="ta-spacer"></div>
  </header>
  <p class="ta-empty">Loading article...</p>
</div>

<div class="ta-page" *ngIf="!isLoading && article as a">
  <header class="ta-header">
    <button type="button" class="ta-back" (click)="goBack()" aria-label="Go back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <div class="ta-header-text">
      <h1>{{ a.title }}</h1>
      <p>{{ categoryLabel }}</p>
    </div>
    <div class="ta-spacer"></div>
  </header>

  <main class="ta-main">
    <div class="ta-hero" [class.has-image]="!!a.coverImageUrl" [style.background]="a.coverGradient">
      <img
        *ngIf="a.coverImageUrl"
        class="ta-hero-img"
        [src]="a.coverImageUrl"
        [alt]="a.title"
        loading="eager"
        decoding="async"
        (error)="onCoverError()" />
      <span *ngIf="!a.coverImageUrl">{{ a.coverLabel }}</span>
    </div>

    <div class="ta-tags">
      <span class="ta-tag pink">{{ categoryLabel }}</span>
      <span class="ta-tag featured" *ngIf="a.featured">★ Featured</span>
    </div>

    <h2 class="ta-title">{{ a.title }}</h2>
    <p class="ta-date" *ngIf="a.updatedAt">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      {{ a.updatedAt }}
    </p>

    <blockquote class="ta-summary" *ngIf="a.summary">{{ a.summary }}</blockquote>

    <section class="ta-article">
      <h3>Article</h3>
      <p *ngFor="let para of paragraphs">{{ para }}</p>
      <p *ngIf="paragraphs.length === 0" class="ta-empty-inline">No article content available.</p>
    </section>
  </main>
</div>

<div class="ta-page" *ngIf="!isLoading && !article">
  <header class="ta-header">
    <button type="button" class="ta-back" (click)="goBack()" aria-label="Go back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
    </button>
    <div class="ta-header-text"><h1>Article</h1></div>
    <div class="ta-spacer"></div>
  </header>
  <p class="ta-empty">{{ loadError || 'Article not found.' }}</p>
</div>
