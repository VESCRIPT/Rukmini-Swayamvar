<div class="bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-12 animate-slide-up">
            <h2 class="font-cinzel text-3xl md:text-4xl font-bold text-pink-950 mb-2">
                Our <span class="gold-shine-text">Groom and Bride</span>
            </h2>
            <div class="flex items-center justify-center gap-4">
                <div class="h-[1px] w-12 bg-pink-200"></div>
                <p class="font-playfair italic text-pink-600 text-lg">Sacred Bonds, Beautiful Beginnings</p>
                <div class="h-[1px] w-12 bg-pink-200"></div>
            </div>
        </div>

        <!-- Slider Container -->
        <div class="relative">
            <!-- Navigation Buttons -->
            <button (click)="scrollLeft()"
                class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-4 z-20 bg-white rounded-full p-3 shadow-lg hover:shadow-xl transition-shadow">
                <i class="fas fa-chevron-left text-gray-700"></i>
            </button>
            <button (click)="scrollRight()"
                class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-4 z-20 bg-white rounded-full p-3 shadow-lg hover:shadow-xl transition-shadow">
                <i class="fas fa-chevron-right text-gray-700"></i>
            </button>

            <!-- Horizontal Scroll Container -->
            <div #scrollContainer class="flex gap-8 overflow-x-auto scrollbar-hide scroll-smooth pb-4 px-2"
                style="scrollbar-width: none; -ms-overflow-style: none;">

                <div *ngFor="let profile of profiles; trackBy: trackByFn"
                    class="profile-card bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col min-w-[280px] max-w-[280px] flex-shrink-0">
                    <div class="relative aspect-[4/5] overflow-hidden">
                        <img [src]="profile.image" [alt]="profile.name" class="w-full h-full object-cover"
                            [style.objectPosition]="profile.position || 'center'"
                            onerror="this.src='https://via.placeholder.com/400x500?text=Profile+Photo'">
                    </div>

                    <div class="p-5 flex-grow flex flex-col items-center text-center">
                        <p class="text-base font-bold text-pink-600 mb-2 uppercase tracking-wide">{{ profile.name }}</p>
                        <div class="text-xs text-gray-500 leading-relaxed mb-6">
                            {{ profile.caste }} | {{ profile.maritalStatus }} | {{ profile.birthDate }} <br>
                            {{ profile.profession }}
                        </div>

                        <button
                            class="mt-auto w-full py-2 px-4 pink-gradient text-white font-semibold rounded-lg shadow-sm hover:opacity-90 transition-opacity">
                            View Profile
                        </button>
                    </div>
                </div>
            </div>

            <!-- Slider Indicators -->
            <div class="flex justify-center mt-6 space-x-2">
                <span *ngFor="let profile of profiles; let i = index"
                    class="h-3 w-3 rounded-full cursor-pointer transition-all duration-300"
                    [ngClass]="{'bg-red-500': i === activeCardIndex, 'bg-gray-300': i !== activeCardIndex}"
                    (click)="scrollToCard(i)"></span>
            </div>
        </div>
    </div>
</div>
