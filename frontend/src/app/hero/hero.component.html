<section class="hero-section w-full min-h-[60vh] flex items-start justify-center relative overflow-hidden">
  <div class="soft-pattern"></div>

  <div class="relative z-10 container mx-auto px-6 pt-4 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
      <!-- Left Column: Information -->
      <div class="text-left animate-slide-up">
        <h1 class="font-Roboto text-3xl md:text-4xl font-bold text-pink-950 mb-6 leading-tight">
          Welcome to <span class="gold-shine-text">Rukmini Swayamvar</span> <br>
          <span class="text-xl md:text-2xl text-pink-600 uppercase">WHERE TRADITIONS MEET NEW BEGINNINGS</span>
          <p class="text-[#e644b0] mt-3 text-lg font-medium">Find your life partner through shared values, family traditions, and meaningful connections.</p>
        </h1>

        <div class="mt-6">
          <app-qr-code></app-qr-code>
        </div>
        <div class="mt-10">
          <button (click)="setView('register')"
            class="bg-[#ed5295] text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-[#d43d7d] transition-all transform hover:-translate-y-1 active:scale-95">
            Begin Your Sacred Journey
          </button>

        </div>
      </div>

      <!-- Right Column: Premium Container -->
      <div class="flex justify-center lg:justify-end animate-fade-in-delayed">
        <div class="hero-right-container glassmorphism-premium">
          <div class="inner-decoration"></div>
          <div class="content-placeholder w-full h-full relative overflow-hidden">
            <img *ngFor="let slide of heroSlides; let i = index; trackBy: trackSlide"
              [ngSrc]="slide.jpg"
              [width]="slide.width"
              [height]="slide.height"
              [priority]="i === 0"
              [class.opacity-0]="currentHeroIndex !== i"
              [class.opacity-100]="currentHeroIndex === i"
              class="hero-slide-image absolute top-0 left-1/2 -translate-x-1/2 transition-opacity duration-1000"
              alt="Rukmini Swayamvar Heritage">
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
