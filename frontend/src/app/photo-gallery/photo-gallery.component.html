<div class="gallery-container">
    <!-- Header -->
    <header class="header">
        <button class="back-btn" (click)="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <h1>Photo Gallery</h1>
        <div class="placeholder"></div>
        <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" multiple
            style="display: none;">
    </header>

    <div class="content">
        <!-- Error Banner -->
        <div *ngIf="errorMessage" class="error-banner" style="background-color: #ffebee; color: #c62828; padding: 12px; border-radius: 12px; margin-top: 1rem; border: 1px solid #ffcdd2; font-size: 0.9rem; text-align: center; font-weight: 500;">
            {{ errorMessage }}
        </div>

        <!-- Approved Photos Section -->
        <div *ngIf="photos.length > 0 || pendingPhotos.length > 0" class="section-title"></div>

        <!-- Empty State -->
        <div *ngIf="photos.length === 0 && pendingPhotos.length === 0" class="empty-state">
            <div class="empty-icon-wrapper">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="1.2">
                    <!-- Bottom Layer Photo -->
                    <rect x="3" y="7" width="14" height="14" rx="2" stroke-dasharray="1 0" />
                    <!-- Top Layer Photo -->
                    <rect x="7" y="3" width="14" height="14" rx="2" fill="white" stroke="#A0AEC0" />
                    <circle cx="11.5" cy="7.5" r="1.5" fill="#A0AEC0" stroke="none" />
                    <path d="M7 13l3-3 5 5 2-2 4 4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <p class="no-photos-text">No photos yet</p>
            <button class="add-photo-btn" (click)="fileInput.click()">
                <span class="plus-icon">+</span>
                Add Photo
            </button>
        </div>

        <!-- Photo Grid -->
        <div *ngIf="photos.length > 0" class="photo-grid">
            <div *ngFor="let photo of photos; let i = index" class="photo-card">
                <img [src]="photo.url" alt="Gallery Photo">
                <div *ngIf="isPreferredPhoto(photo)" class="profile-photo-badge">
                    <span class="star">★</span>
                    <span>Profile photo</span>
                </div>
                <button class="remove-btn" (click)="removePhoto(i)" title="Remove Photo">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
                <button *ngIf="canSetAsProfilePhoto(photo)" class="set-profile-btn" (click)="setAsProfilePhoto(i)" type="button">
                    Set as profile photo
                </button>
            </div>
            <!-- Add Photo Card at 6th position -->
            <div class="photo-card add-photo-card" (click)="fileInput.click()" title="Add Photo">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="3" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="M3 15l5-5 4 4 3-3 5 5" stroke-linecap="round" stroke-linejoin="round" />
                    <line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round" />
                    <line x1="10" y1="10" x2="14" y2="10" stroke-linecap="round" />
                </svg>
                <span>Add Photo</span>
            </div>
        </div>

        <!-- Pending Approval Section -->
        <div *ngIf="pendingPhotos.length > 0" class="pending-section">
            <h2 class="pending-title">Pending Approval</h2>
            <div class="pending-grid">
                <div *ngFor="let photo of pendingPhotos; let i = index" class="pending-card">
                    <img [src]="photo.url" alt="Pending Photo">
                    <div class="pending-badge">Pending</div>
                    <button class="remove-btn" (click)="removePendingPhoto(i)" title="Remove Photo">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
