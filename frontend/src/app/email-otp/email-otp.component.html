<div class="min-h-screen pt-24 pb-12 px-4 sm:px-6 flex items-center justify-center bg-[#fff5f9] relative overflow-hidden text-center font-inter">
  <button
    type="button"
    class="otp-back-btn absolute top-4 left-4 sm:top-6 sm:left-6 w-10 h-10 rounded-full border border-pink-200 bg-white text-pink-500 flex items-center justify-center hover:bg-pink-50 transition-colors shadow-sm z-50"
    (click)="onBack()"
    aria-label="Go back"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>
  <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-6 sm:p-10 relative z-10 border border-pink-50 animate-fade-in">
    
    <div class="mb-8">
      <h2 class="font-cinzel gold-shine-text font-bold text-2xl uppercase tracking-widest mb-1">
        Verify Email
      </h2>
      <p class="font-playfair italic text-[#F33A6A] text-sm font-bold uppercase tracking-widest">
        OTP Verification
      </p>
    </div>

    <h3 class="font-playfair italic text-pink-900 text-sm sm:text-base mb-6 font-medium">
      A 6-digit code has been sent to your email
    </h3>

    <form class="space-y-6 text-left" autocomplete="off">
      <div class="relative flex gap-1 sm:gap-3 justify-center mb-6" (click)="hiddenInput.focus()">
        <!-- Single hidden input to handle all native keyboard events flawlessly -->
        <input 
          #hiddenInput
          type="text" 
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          class="absolute inset-0 w-full h-full opacity-0 cursor-text z-20"
          [value]="otpString"
          (input)="onHiddenInput($event)"
        >
        <!-- Visual presentation of the 6 digits -->
        <div *ngFor="let digit of [0, 1, 2, 3, 4, 5]; let i = index" class="flex-1 pointer-events-none relative z-10">
          <div 
            class="w-full h-12 sm:h-14 flex items-center justify-center text-xl sm:text-2xl font-bold border-2 rounded-lg transition-colors bg-white"
            [class.border-pink-500]="otpString.length === i || (otpString.length === 6 && i === 5)"
            [class.border-pink-200]="otpString.length !== i && !(otpString.length === 6 && i === 5)"
          >
            {{ otpString[i] || '' }}
          </div>
        </div>
      </div>

      <p *ngIf="errorMessage" class="text-center text-sm text-red-600 font-medium">
        {{ errorMessage }}
      </p>

      <button 
        type="button" 
        [disabled]="otp.join('').length !== 6 || isVerifying"
        (click)="verifyOtp()" 
        class="w-full bg-gradient-to-r from-pink-500 to-rose-600 text-white py-4 rounded-full font-bold text-base shadow-xl transition-all duration-300 hover:scale-105 hover:shadow-2xl hover:from-pink-600 hover:to-rose-700 active:scale-95 uppercase tracking-widest disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
      >
        {{ isVerifying ? 'Verifying...' : 'Verify OTP' }}
      </button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-sm text-gray-600 mb-4">
        Didn't receive the code? 
        <button (click)="resendOtp()" class="text-pink-500 font-bold hover:underline ml-1">
          Resend OTP
        </button>
      </p>
      <button type="button" (click)="onBack()" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">
        ← Back to Home
      </button>
    </div>
  </div>
</div>
